services:
  app:
    image: ghcr.io/aldo-leka/website:${IMAGE_TAG:-latest}
    container_name: website-app
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_STATS_DATABASE_URL: ${UMAMI_STATS_DATABASE_URL:-}
      WEBSITE_ANALYTICS_START_DATE: ${WEBSITE_ANALYTICS_START_DATE:-}
      WEBSITE_ANALYTICS_ENABLED: ${WEBSITE_ANALYTICS_ENABLED:-false}
    expose:
      - "3000"
    networks:
      - ingress
      - analytics

networks:
  ingress:
    external: true
    name: yhp99hliq5cujkenfl2ln6rp
  analytics:
    external: true
    name: website-analytics
