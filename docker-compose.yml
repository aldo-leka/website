services:
  app:
    image: ghcr.io/aldo-leka/website:${IMAGE_TAG:-latest}
    container_name: website-app
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      GOATCOUNTER_SITE: ${GOATCOUNTER_SITE:-}
      GOATCOUNTER_API_KEY: ${GOATCOUNTER_API_KEY:-}
      GOATCOUNTER_START_DATE: ${GOATCOUNTER_START_DATE:-}
      WEBSITE_ANALYTICS_ENABLED: ${WEBSITE_ANALYTICS_ENABLED:-false}
    expose:
      - "3000"
    networks:
      - ingress

networks:
  ingress:
    external: true
    name: yhp99hliq5cujkenfl2ln6rp
